<aside>
  <div>
    <div>
      <h3 class="latest-posts">Latest Posts</h3>
    </div>
    <div>
      <ul class="latest-posts">
	{{ range first 5 (where .Site.RegularPages "Type" "in" .Site.Params.mainSections) }}
	<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
	{{ end }}
      </ul>
    </div>
  </div>
</aside>
